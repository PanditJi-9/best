name: Android smoke

# Launch the built APK on a real Android system image and keep the logcat.
# Manual on purpose: it costs a full emulator boot and runs on demand, while
# `CI` stays fast enough to gate every push.
on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: Extra extension packages to activate, comma separated
        required: false
        default: ""
      manga_sources:
        description: Manga source names for the gate, comma separated (defaults to four)
        required: false
        default: ""

jobs:
  launch:
    name: Install and open the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android platform
        run: sh tool/bootstrap_android.sh

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: sh tool/configure_signing.sh

      # The emulator system image does not fit next to the runner's preloaded
      # toolchains, so drop the ones this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Build the release APK
        working-directory: apps/best_app
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --release

      # AGP 9 creates only debug unit tests by default. Explicitly retain the
      # release test variant so this gate checks the runtime we actually ship.
      - name: Extension runtime JVM compatibility tests
        working-directory: apps/best_app/android
        run: |
          bash ./gradlew :app:testReleaseUnitTest --no-daemon -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false
          test -f ../build/app/test-results/testReleaseUnitTest/TEST-app.best.best_app.ext.RuntimeAbiTest.xml

      - name: Keep runtime test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-abi-tests
          path: |
            apps/best_app/build/app/test-results/testReleaseUnitTest/
            apps/best_app/build/app/reports/tests/testReleaseUnitTest/
          if-no-files-found: warn

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim
          script: sh tool/run_android_smoke.sh
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
          MANGA_SMOKE_SOURCES: ${{ inputs.manga_sources }}

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: |
            screenshot.png
            directory.png
            directory.xml
            playback.png
            sources.txt
            extensions.log
            logcat.txt
            anime-*.png
            anime-*.xml
            anime-results.json
            manga-*.png
            manga-*.xml
            manga-results.json
            manga-runtime-errors.json
          if-no-files-found: warn
