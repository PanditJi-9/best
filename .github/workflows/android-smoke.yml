name: Android smoke

# Launch the built APK on a real Android system image and keep the logcat.
# Manual on purpose: it costs a full emulator boot and runs on demand, while
# `CI` stays fast enough to gate every push.
on:
  workflow_dispatch:

jobs:
  launch:
    name: Install and open the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android platform
        run: sh tool/bootstrap_android.sh

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: sh tool/configure_signing.sh

      # The emulator system image does not fit next to the runner's preloaded
      # toolchains, so drop the ones this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Build the release APK
        working-directory: apps/best_app
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim
          script: sh tool/run_android_smoke.sh

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: |
            screenshot.png
            playback.png
            sources.txt
            extensions.log
            logcat.txt
            anime-*.png
            anime-results.json
          if-no-files-found: warn
