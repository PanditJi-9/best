name: Android smoke

# Launch the built APK on a real Android system image and keep the logcat.
# Manual on purpose: it costs a full emulator boot and runs on demand, while
# `CI` stays fast enough to gate every push.
on:
  workflow_dispatch:

jobs:
  launch:
    name: Install and open the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android platform
        run: sh tool/bootstrap_android.sh

      # The emulator system image does not fit next to the runner's preloaded
      # toolchains, so drop the ones this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Build the release APK
        working-directory: apps/best_app
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim
          script: |
            set -x
            APK=apps/best_app/build/app/outputs/flutter-apk/app-release.apk
            unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/lib(app|flutter)\.so' || true
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n app.best.best_app/.MainActivity
            sleep 25
            adb exec-out screencap -p > screenshot.png || true
            adb shell uiautomator dump /sdcard/window.xml || true
            adb shell cat /sdcard/window.xml | head -c 6000 || true
            pid=$(adb shell pidof app.best.best_app || true)
            echo "PID=$pid"
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            adb logcat -d -v brief | grep -iE 'flutter|AndroidRuntime|best_app|FATAL|impeller|libflutter' | tail -200 || true
            test -n "$pid"
