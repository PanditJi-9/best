name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tools:
    name: Packaging and emulator tooling regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test APK packaging, navigation and real-extension gates without a device
        run: python3 -m unittest discover -s tool/tests -v

  samples:
    name: Guide sample streams answer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The guide ships hard-coded demo streams. Google's sample bucket was made
      # private and started answering 403, which turned the first-run "play"
      # button into an error screen. A 20-second probe catches that in seconds
      # instead of after a full emulator boot.
      #
      # 403 is reported, not fatal: Blender's download host blocks datacenter
      # ranges, so a runner sees 403 for a file a phone streams fine. The
      # emulator smoke plays the sample for real and is the gate that counts.
      - name: Probe every stream in the guide
        run: |
          set -eu
          urls=$(grep -oE "https://[^']+\.(mp4|m3u8)" \
            packages/best_data/lib/src/sources/demo_source.dart | sort -u)
          test -n "$urls"
          for url in $urls; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1024 \
              -A 'Mozilla/5.0 (Android 14; Mobile)' \
              --max-time 20 --retry 3 --retry-delay 2 "$url")
            echo "$code $url"
            case "$code" in
              2*|3*) ;;
              403|405) echo "::warning::blocked for this runner: $code $url" ;;
              *) echo "::error::unreachable: $code $url"; exit 1 ;;
            esac
          done

  core:
    name: Dart packages and Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: best_domain
        working-directory: packages/best_domain
        run: |
          dart pub get
          dart analyze
          dart test

      - name: best_data
        working-directory: packages/best_data
        run: |
          dart pub get
          dart analyze
          dart test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: best_core
        working-directory: rust/best_core
        run: |
          cargo fmt --check
          cargo test --locked

  app:
    name: Flutter quality gates and four release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            tool/android/*.gradle.kts
            tool/android/gradle.properties
            apps/best_app/pubspec.lock

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android platform
        run: sh tool/bootstrap_android.sh

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: sh tool/configure_signing.sh

      - name: Dependencies and localization
        working-directory: apps/best_app
        run: |
          flutter pub get
          flutter gen-l10n

      # Keep the exact remote dependency resolution available without running
      # pub get on the phone.
      - name: Keep resolved Flutter dependencies
        uses: actions/upload-artifact@v4
        with:
          name: flutter-dependency-lock
          path: apps/best_app/pubspec.lock
          if-no-files-found: error

      - name: Analyze
        working-directory: apps/best_app
        run: flutter analyze --no-pub

      - name: Widget tests
        working-directory: apps/best_app
        run: flutter test --no-pub

      - name: Build four release APKs in one assembly
        working-directory: apps/best_app
        run: python3 ../../tool/android_apks.py build

      - name: Keep directory widget renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-directory-renders
          path: apps/best_app/build/source-directory-*.png
          if-no-files-found: warn

      - name: Keep redesigned screen renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redesign-renders
          path: apps/best_app/build/redesign-*.png
          if-no-files-found: warn

      - name: Keep reader regression renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-renders
          path: apps/best_app/build/reader-*.png
          if-no-files-found: warn

      - name: Keep work-page regression renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: series-renders
          path: apps/best_app/build/series-*.png
          if-no-files-found: warn

      - name: Keep download and chapter-tool regression renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-tools-renders
          path: |
            apps/best_app/build/download-tools-*.png
            apps/best_app/build/chapter-tools-*.png
          if-no-files-found: warn

      # AGP 9 creates only debug unit tests by default. Explicitly retain the
      # release test variant so this gate checks the runtime we actually ship.
      - name: Extension runtime JVM compatibility tests
        working-directory: apps/best_app/android
        run: |
          bash ./gradlew :app:testReleaseUnitTest --no-daemon -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false
          test -f ../build/app/test-results/testReleaseUnitTest/TEST-app.best.best_app.ext.RuntimeAbiTest.xml

      - name: Keep runtime test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-abi-tests
          path: |
            apps/best_app/build/app/test-results/testReleaseUnitTest/
            apps/best_app/build/app/reports/tests/testReleaseUnitTest/
          if-no-files-found: warn

      # A release signed with the runner's throwaway debug key cannot be
      # updated in place, so publishing stops before the upload.
      - name: Verify all four ABIs, versions and release signatures
        working-directory: apps/best_app
        run: python3 ../../tool/android_apks.py verify

      - uses: actions/upload-artifact@v4
        with:
          name: best-release-apk-arm64-v8a
          path: apps/best_app/build/release-apks/app-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: best-release-apk-armeabi-v7a
          path: apps/best_app/build/release-apks/app-armeabi-v7a-release.apk
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: best-release-apk-x86_64
          path: apps/best_app/build/release-apks/app-x86_64-release.apk
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: best-release-apk
          path: |
            apps/best_app/build/release-apks/app-release.apk
            apps/best_app/build/release-apks/manifest.json
            apps/best_app/build/release-apks/signatures.json
            apps/best_app/build/release-apks/SHA256SUMS
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      # A tag is the only thing that publishes. Every main build stays an
      # artifact, so a release always points at a commit someone chose.
      - name: Publish the four APKs as release assets
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/best_app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An Arabic note file per version, when the release ships one, so the
          # published page explains the change in the reader's language.
          notes="../../docs/releases/${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              build/release-apks/app-arm64-v8a-release.apk \
              build/release-apks/app-armeabi-v7a-release.apk \
              build/release-apks/app-x86_64-release.apk \
              build/release-apks/app-release.apk \
              build/release-apks/SHA256SUMS \
              --title "Best ${GITHUB_REF_NAME}" \
              --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" \
              build/release-apks/app-arm64-v8a-release.apk \
              build/release-apks/app-armeabi-v7a-release.apk \
              build/release-apks/app-x86_64-release.apk \
              build/release-apks/app-release.apk \
              build/release-apks/SHA256SUMS \
              --title "Best ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
