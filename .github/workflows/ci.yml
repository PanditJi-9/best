name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tools:
    name: Emulator tooling regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test navigation and real-extension gates without a device
        run: python3 -m unittest discover -s tool/tests -v

  samples:
    name: Guide sample streams answer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The guide ships hard-coded demo streams. Google's sample bucket was made
      # private and started answering 403, which turned the first-run "play"
      # button into an error screen. A 20-second probe catches that in seconds
      # instead of after a full emulator boot.
      #
      # 403 is reported, not fatal: Blender's download host blocks datacenter
      # ranges, so a runner sees 403 for a file a phone streams fine. The
      # emulator smoke plays the sample for real and is the gate that counts.
      - name: Probe every stream in the guide
        run: |
          set -eu
          urls=$(grep -oE "https://[^']+\.(mp4|m3u8)" \
            packages/best_data/lib/src/sources/demo_source.dart | sort -u)
          test -n "$urls"
          for url in $urls; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1024 \
              -A 'Mozilla/5.0 (Android 14; Mobile)' \
              --max-time 20 --retry 3 --retry-delay 2 "$url")
            echo "$code $url"
            case "$code" in
              2*|3*) ;;
              403|405) echo "::warning::blocked for this runner: $code $url" ;;
              *) echo "::error::unreachable: $code $url"; exit 1 ;;
            esac
          done

  core:
    name: Dart packages and Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: best_domain
        working-directory: packages/best_domain
        run: |
          dart pub get
          dart analyze
          dart test

      - name: best_data
        working-directory: packages/best_data
        run: |
          dart pub get
          dart analyze
          dart test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: best_core
        working-directory: rust/best_core
        run: |
          cargo fmt --check
          cargo test --locked

  app:
    name: Flutter analyze, test and release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android platform
        run: sh tool/bootstrap_android.sh

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: sh tool/configure_signing.sh

      - name: Dependencies and localization
        working-directory: apps/best_app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Analyze
        working-directory: apps/best_app
        run: flutter analyze

      - name: Widget tests
        working-directory: apps/best_app
        run: flutter test

      - name: Build release APK
        working-directory: apps/best_app
        run: flutter build apk --release

      # A release signed with the runner's throwaway debug key cannot be
      # updated in place, so publishing stops before the upload.
      - name: Verify the release signature
        working-directory: apps/best_app
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          grep -q "CN=Best App" certs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: best-release-apk
          path: apps/best_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # A tag is the only thing that publishes. Every main build stays an
      # artifact, so a release always points at a commit someone chose.
      - name: Publish the APK as a release asset
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/best_app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Best ${GITHUB_REF_NAME}" \
            --generate-notes
