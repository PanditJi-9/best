name: best_app
description: Best — one shelf for manga, manhwa, anime and Asian drama.
publish_to: none
version: 1.6.0+29

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  best_data:
    path: ../../packages/best_data
  best_domain:
    path: ../../packages/best_domain
  best_ui:
    path: ../../packages/best_ui
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  http: ^1.2.0
  intl: any
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  share_plus: ^13.3.1
  sqflite: ^2.4.1
  video_player: ^2.14.1
  wakelock_plus: ^1.8.2
  connectivity_plus: ^7.3.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_lints: ^5.0.0
  video_player_platform_interface: ^6.9.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/curated.json
    - assets/subtitles/guide.vtt
