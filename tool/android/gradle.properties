# The Flutter template asks for -Xmx8G and leaves the Kotlin daemon at the
# same ceiling. On an 8 GB phone (or a laptop already running an IDE) that
# swaps or gets OOM-killed before the APK is assembled. Best's app module is
# small enough for 3G + a 2G Kotlin daemon.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
org.gradle.workers.max=2

android.useAndroidX=true
# These two flags are added by the current Flutter template.
android.newDsl=false
android.builtInKotlin=false
